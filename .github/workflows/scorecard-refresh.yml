name: Refresh generated scorecard (temporary helper)

on:
  push:
    branches:
      - diagnose/android-open-font-fix
    paths:
      - .github/workflows/scorecard-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scorecard-refresh-diagnose
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: diagnose/android-open-font-fix
          fetch-depth: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate scorecard from repository sources
        run: cargo xtask scorecard

      - name: Commit generated document only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scorecard.md
          if git diff --cached --quiet; then
            echo "Generated scorecard matches the committed file; no commit needed."
            exit 0
          fi
          git commit -m "chore: regenerate generated scorecard"
          git push origin HEAD:diagnose/android-open-font-fix
